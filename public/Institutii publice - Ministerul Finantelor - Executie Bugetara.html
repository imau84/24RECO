const fmt = (v) => {
  if (v === undefined || v === null) return '—';
  return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
};
const fmtPct = (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

const KPICard = ({ label, value, delta, pct, color = C.blue, sub }) => {
  const pos = pct >= 0;
  return (
    <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '18px 20px', flex: 1 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700, color, fontVariantNumeric: 'tabular-nums', lineHeight: 1, marginBottom: 6 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: C.subtle, marginBottom: 4 }}>{sub}</div>}
      {delta !== undefined && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
          <span style={{
            background: pos ? C.greenLight : C.redLight,
            color: pos ? C.green : C.red,
            borderRadius: 4, padding: '2px 7px', fontSize: 11, fontWeight: 600
          }}>{fmtPct(pct)}</span>
          <span style={{ fontSize: 11, color: C.muted }}>vs ian-feb 2025</span>
        </div>
      )}
    </div>
  );
};

/* ── Bar Chart SVG ── */
const BarChartComparativ = ({ data }) => {
  const W = 600, H = 200, PL = 60, PR = 20, PT = 20, PB = 30;
  const chartW = W - PL - PR, chartH = H - PT - PB;
  const labels = ['Ian 2026','Feb 2026'];
  const pairs = [
    { v25: data[0].ian25, v26: data[0].ian26, c26: '#1a56db', c25: '#93c5fd' },
    { v25: data[0].feb25, v26: data[0].feb26, c26: '#1a56db', c25: '#93c5fd' },
  ];
  const allVals = pairs.flatMap(p => [p.v25, p.v26]);
  const maxV = Math.max(...allVals) * 1.1;
  const barW = chartW / pairs.length / 2 - 6;
  const groupW = chartW / pairs.length;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}>
      {/* grid lines */}
      {[0, 0.25, 0.5, 0.75, 1].map(t => {
        const y = PT + chartH - t * chartH;
        const v = t * maxV;
        return (
          <g key={t}>
            <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={C.border} strokeWidth={0.5} />
            <text x={PL - 6} y={y + 4} textAnchor="end" fontSize={9} fill={C.muted}>
              {(v / 1000).toFixed(0)}K
            </text>
          </g>
        );
      })}
      {/* bars */}
      {pairs.map((p, i) => {
        const gx = PL + i * groupW + groupW / 2;
        const h25 = (p.v25 / maxV) * chartH;
        const h26 = (p.v26 / maxV) * chartH;
        return (
          <g key={i}>
            <rect x={gx - barW - 2} y={PT + chartH - h25} width={barW} height={h25} fill={p.c25} rx={2} />
            <rect x={gx + 2} y={PT + chartH - h26} width={barW} height={h26} fill={p.c26} rx={2} />
            <text x={gx} y={H - 8} textAnchor="middle" fontSize={9} fill={C.muted}>{labels[i].split('\n')[0]}</text>
            {labels[i].includes('\n') && <text x={gx} y={H - 0} textAnchor="middle" fontSize={8} fill={C.muted}>{labels[i].split('\n')[1]}</text>}
          </g>
        );
      })}
      {/* legend */}
      <rect x={PL} y={4} width={10} height={8} fill="#93c5fd" rx={1} />
      <text x={PL + 14} y={11} fontSize={9} fill={C.muted}>2025</text>
      <rect x={PL + 46} y={4} width={10} height={8} fill="#1a56db" rx={1} />
      <text x={PL + 60} y={11} fontSize={9} fill={C.muted}>2026</text>
    </svg>
  );
};

/* ── Grafic Evoluție Deficit 2006–2025 ── */
const DeficitLineChart = () => {
  const [hover, setHover] = React.useState(null);
  const [chartType, setChartType] = React.useState('bare'); // 'bare' | 'pib' | 'combinat'

  const W = 860, H = 320, PL = 75, PR = 30, PT = 40, PB = 50;
  const chartW = W - PL - PR, chartH = H - PT - PB;
  const n = ISTORIC.length;

  // For bare chart: show deficit absolute values as bars
  const defVals = ISTORIC.map(r => r.def);
  const venVals = ISTORIC.map(r => r.ven);
  const chelVals = ISTORIC.map(r => r.chel);
  const pctVals = ISTORIC.map(r => r.pct);

  const minDef = Math.min(...defVals) * 1.12;
  const maxDef = 20000;
  const rangeD = maxDef - minDef;

  const minPct = Math.min(...pctVals) * 1.15;
  const maxPct = 2;
  const rangePct = maxPct - minPct;

  const maxVen = Math.max(...chelVals) * 1.08;

  const xOf = (i) => PL + (i / (n - 1)) * chartW;
  const yOfD = (v) => PT + ((maxDef - v) / rangeD) * chartH;
  const yOfP = (v) => PT + ((maxPct - v) / rangePct) * chartH;
  const zeroYD = yOfD(0);
  const zeroYP = yOfP(0);

  const barW = chartW / n * 0.55;

  const fmtK = (v) => {
    if (Math.abs(v) >= 1000) return (v / 1000).toFixed(1) + 'K';
    return v.toFixed(0);
  };

  const gridLinesD = [0, -25000, -50000, -75000, -100000, -125000, -150000];
  const gridLinesPct = [0, -2, -4, -6, -8, -10];

  return (
    <div>
      {/* Chart type selector */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
        {[['bare','📊 Deficit absolut (mil. lei)'],['pib','📈 Deficit % din PIB'],['combinat','⊞ Venituri vs. Cheltuieli']].map(([id, lbl]) => (
          <button key={id} onClick={() => setChartType(id)} style={{
            background: chartType === id ? C.navy : '#fff',
            color: chartType === id ? '#fff' : C.muted,
            border: `1px solid ${chartType === id ? C.navy : C.border}`,
            borderRadius: 6, padding: '5px 14px', fontSize: 12,
            cursor: 'pointer', fontFamily: 'DM Sans', fontWeight: chartType === id ? 600 : 400
          }}>{lbl}</button>
        ))}
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}
        onMouseLeave={() => setHover(null)}>

        {/* ── GRAFIC BARE — deficit absolut ── */}
        {chartType === 'bare' && <>
          {/* grid */}
          {gridLinesD.map(v => {
            const y = yOfD(v);
            return (
              <g key={v}>
                <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={v === 0 ? '#aaa' : C.border} strokeWidth={v === 0 ? 1 : 0.5} strokeDasharray={v === 0 ? '0' : '3,3'} />
                <text x={PL - 6} y={y + 4} textAnchor="end" fontSize={9} fill={C.muted}>{fmtK(v)}</text>
              </g>
            );
          })}
          {/* bars */}
          {ISTORIC.map((r, i) => {
            const x = PL + i * (chartW / n) + (chartW / n - barW) / 2;
            const barH = Math.abs(yOfD(r.def) - zeroYD);
            const isHover = hover === i;
            const isBad = r.pct < -6;
            const barColor = isBad ? '#dc2626' : r.pct < -3 ? '#f97316' : '#1a56db';
            return (
              <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                <rect x={x} y={zeroYD} width={barW} height={barH}
                  fill={isHover ? (isBad ? '#b91c1c' : C.navy) : barColor}
                  rx={2} opacity={isHover ? 1 : 0.85} />
                {/* value label on top of bar */}
                <text x={x + barW / 2} y={zeroYD + barH + 11} textAnchor="middle"
                  fontSize={isHover ? 9 : 7.5} fontWeight={isHover ? '700' : '400'}

            <linearGradient id="defGrad" x1="0" y1="0" x2="0" y2="1">

            points={[
              `${xOf(0)},${zeroYP}`,

          <polyline
            points={ISTORIC.map((r, i) => `${xOf(i)},${yOfP(r.pct)}`).join(' ')}
            stroke="#1a56db" strokeWidth={2.5} fill="none" strokeLinejoin="round" />
          {/* Dots + labels */}
          {ISTORIC.map((r, i) => {
            const x = xOf(i), y = yOfP(r.pct);
            const isHover = hover === i;
            const isBad = r.pct < -6;
            const col = isBad ? '#dc2626' : r.pct < -3 ? '#f97316' : '#1a56db';
            return (
              <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                <circle cx={x} cy={y} r={isHover ? 6 : 4} fill={col} stroke="#fff" strokeWidth={1.5} />

                <text x={x} y={y - 9} textAnchor="middle" fontSize={isHover ? 9.5 : 8}
                  fontWeight={isHover ? '700' : '500'} fill={col}>
                  {r.pct.toFixed(1)}%
                </text>
                {/* year below */}
                <text x={x} y={H - 6} textAnchor="middle" fontSize={8.5} fill={C.text}
                  fontWeight={isHover ? '700' : '400'}>{r.an}</text>
              </g>

          })}
          {/* hover tooltip */}
          {hover !== null && (() => {
            const r = ISTORIC[hover];
            const x = xOf(hover);
            const tx = Math.min(Math.max(x - 80, 10), W - 175);

                <rect x={tx} y={8} width={175} height={68} rx={5} fill={C.navy} opacity={0.95} />

                <text x={tx + 10} y={53} fontSize={9} fill="#93c5fd">Deficit: {new Intl.NumberFormat('en-US').format(Math.round(r.def))} mil. lei</text>
                <text x={tx + 10} y={66} fontSize={9} fill="#86efac">PIB: {new Intl.NumberFormat('en-US').format(r.pib)} mil. lei</text>

            const v = t * maxVen;
            const y = PT + chartH - t * chartH;
            return (
              <g key={t}>
                <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={C.border} strokeWidth={0.5} strokeDasharray="3,3" />

              </g>

          {/* Venituri area */}
          <polygon
            points={[
              `${xOf(0)},${PT + chartH}`,
              ...ISTORIC.map((r, i) => `${xOf(i)},${PT + chartH - (r.ven / maxVen) * chartH}`),
              `${xOf(n-1)},${PT + chartH}`
            ].join(' ')}
            fill="rgba(26,86,219,0.15)" />
          <polyline
            points={ISTORIC.map((r, i) => `${xOf(i)},${PT + chartH - (r.ven / maxVen) * chartH}`).join(' ')}
            stroke="#1a56db" strokeWidth={2} fill="none" strokeLinejoin="round" />
          {/* Cheltuieli line */}
          <polyline
            points={ISTORIC.map((r, i) => `${xOf(i)},${PT + chartH - (r.chel / maxVen) * chartH}`).join(' ')}

          {/* Dots + year labels */}
          {ISTORIC.map((r, i) => {

          <line x1={PL} y1={PT - 18} x2={PL + 20} y2={PT - 18} stroke="#1a56db" strokeWidth={2} />

          <line x1={PL + 80} y1={PT - 18} x2={PL + 100} y2={PT - 18} stroke="#dc2626" strokeWidth={2} strokeDasharray="5,2" />

          {/* hover tooltip */}
          {hover !== null && (() => {
            const r = ISTORIC[hover];
            const x = xOf(hover);
            const tx = Math.min(Math.max(x - 85, 10), W - 185);

              <g>
                <rect x={tx} y={8} width={180} height={72} rx={5} fill={C.navy} opacity={0.95} />

                <text x={tx + 10} y={40} fontSize={9} fill="#93c5fd">Venituri: {new Intl.NumberFormat('en-US').format(Math.round(r.ven))} mil.</text>

          })()}
        </>}
      </svg>

      {/* Tabel rezumat sub grafic */}
      <div style={{ marginTop: 16, overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
          <thead>
            <tr style={{ background: C.navy }}>
              {['An','Venituri (mil. lei)','Cheltuieli (mil. lei)','Deficit (mil. lei)','% PIB','% Venituri'].map(h => (
                <th key={h} style={{ padding: '7px 10px', color: '#fff', fontWeight: 600, fontSize: 10, textAlign: h === 'An' ? 'center' : 'right' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {ISTORIC.map((r, i) => {
              const isBad = r.pct < -6;
              const isMed = r.pct < -3;
              const bg = i % 2 === 0 ? '#fff' : '#fafafa';
              return (
                <tr key={r.an} style={{ background: bg, borderBottom: `1px solid ${C.border}` }}
                  onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>

                  <td style={{ padding: '5px 10px', textAlign: 'right', fontFamily: 'DM Mono, monospace' }}>{new Intl.NumberFormat('en-US', {minimumFractionDigits:1}).format(r.ven)}</td>
                  <td style={{ padding: '5px 10px', textAlign: 'right', fontFamily: 'DM Mono, monospace' }}>{new Intl.NumberFormat('en-US', {minimumFractionDigits:1}).format(r.chel)}</td>
                  <td style={{ padding: '5px 10px', textAlign: 'right', fontFamily: 'DM Mono, monospace', color: C.red, fontWeight: 600 }}>
                    {new Intl.NumberFormat('en-US', {minimumFractionDigits:1}).format(r.def)}

                      background: isBad ? C.redLight : isMed ? '#fff7ed' : '#f9fafb',

                    {(() => {
                      const pVen = (Math.abs(r.def) / r.ven * 100);
                      const isHighV = pVen > 20;
                      const isMedV = pVen > 10;
                      return (
                        <span style={{
                          background: isHighV ? C.redLight : isMedV ? '#fff7ed' : '#f9fafb',
                          color: isHighV ? C.red : isMedV ? '#c2410c' : C.muted,

            <tr style={{ background: C.navy, borderTop: `2px solid ${C.border}` }}>

/* ── Export CSV util ── */
const exportCSV = () => {
  const headers = ['Indicator','Ian 2026','Feb 2026','Ian-Feb 2026 Cumulat','Ian 2025','Feb 2025','Ian-Feb 2025 Cumulat','Variatie (%)'];
  const rows = DATA.rows.map(r =>
    [r.label, r.ian26, r.feb26, r.cum26, r.ian25, r.feb25, r.cum25, r.var].join(';')
  );
  const csv = '\uFEFF' + [headers.join(';'), ...rows].join('\n'); // BOM for Excel
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'deficit_bugetar_ian_feb_2026.csv';
  a.click(); URL.revokeObjectURL(url);
};

/* ── Tabel date ── */
const DataTable = ({ filter, search }) => {
  const cols = [
    { key: 'ian26', label: 'Ian 2026',   sub: 'mil. lei' },
    { key: 'feb26', label: 'Feb 2026',   sub: 'mil. lei' },
    { key: 'ian25', label: 'Ian 2025',   sub: 'mil. lei' },
    { key: 'feb25', label: 'Feb 2025',   sub: 'mil. lei' },
    { key: 'var',   label: 'Variație',   sub: '26/25 %' },
  ];

  const filteredRows = DATA.rows.filter(r => {
    if (filter !== 'toate' && r.cat !== filter) return false;
    if (search && !r.label.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  return (
    <div style={{ overflowX: 'auto' }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
        <thead>
          <tr style={{ background: C.navy }}>
            <th style={{ textAlign: 'left', padding: '10px 14px', color: '#fff', fontWeight: 600, fontSize: 11, position: 'sticky', left: 0, background: C.navy, minWidth: 240 }}>
              Indicator
            </th>
            {cols.map(c => (
              <th key={c.key} style={{ textAlign: 'right', padding: '10px 12px', color: '#fff', fontWeight: 600, fontSize: 11, whiteSpace: 'nowrap', minWidth: 110 }}>
                {c.label}<br/><span style={{ fontWeight: 400, opacity: 0.65, fontSize: 10 }}>{c.sub}</span>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {filteredRows.map((row, i) => {
            const isDeficit = row.cat === 'deficit';
            const rowBg = row.bold
              ? isDeficit ? '#fff8f0' : row.cat === 'venituri' ? '#f0f7ff' : '#f5f0ff'
              : i % 2 === 0 ? '#fff' : '#fafafa';
            return (
              <tr key={i} style={{ background: rowBg, borderBottom: `1px solid ${C.border}` }}>
                <td style={{
                  padding: `${row.bold ? 9 : 7}px 14px`,
                  paddingLeft: 14 + (row.indent || 0) * 14,
                  fontWeight: row.bold ? 700 : 400,
                  color: isDeficit && row.bold ? C.red : row.bold ? C.navy : C.text,
                  fontSize: row.bold ? 12 : 11,
                  borderLeft: row.bold ? `3px solid ${isDeficit ? C.red : row.cat === 'venituri' ? C.blue : '#7c3aed'}` : '3px solid transparent',
                  position: 'sticky', left: 0, background: rowBg,
                }}>
                  {row.label}
                </td>
                {cols.map(c => {
                  const v = row[c.key];
                  const isVar = c.key === 'var';
                  const isNeg = v < 0;
                  return (
                    <td key={c.key} style={{
                      textAlign: 'right', padding: '7px 12px',
                      fontFamily: isVar ? 'DM Sans' : 'DM Mono, monospace',
                      fontSize: 11, fontWeight: row.bold ? 600 : 400,
                      color: isVar
                        ? (v >= 0 ? C.green : C.red)
                        : (isNeg ? C.red : C.text),
                    }}>
                      {isVar
                        ? <span style={{
                            background: v >= 0 ? C.greenLight : C.redLight,
                            padding: '2px 6px', borderRadius: 4,
                          }}>{fmtPct(v)}</span>
                        : fmt(v)
                      }
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
};

/* ══ Componenta Salariati Bugetari ══ */
const SalariatiBugetari = () => {
  const [subtab, setSubtab] = React.useState('institutii');
  const [hover, setHover] = React.useState(null);
  const [sortBy, setSortBy] = React.useState('ian2026');
  const [catFilter, setCatFilter] = React.useState('toate');

  const fmtS = (v) => new Intl.NumberFormat('en-US').format(v);

  // Ultima luna = index 12 (Ian 2026), prima = index 0 (Ian 2025)
  const sortedInstitutii = [...SALARIATI.institutii]
    .filter(r => catFilter === 'toate' || r.cat === catFilter)
    .sort((a, b) => {
      if (sortBy === 'ian2026') return b.vals[12] - a.vals[12];
      if (sortBy === 'var') return (a.vals[12] - a.vals[0]) - (b.vals[12] - b.vals[0]);
      return b.vals[12] - a.vals[12];
    });

  // Chart evolutie total
  const W = 860, H = 280, PL = 80, PR = 20, PT = 30, PB = 50;
  const cW = W - PL - PR, cH = H - PT - PB;
  const n = LUNI_SALAR.length;
  const xOf = (i) => PL + (i / (n-1)) * cW;
  const minT = Math.min(...SALARIATI.total) - 20000;
  const maxT = Math.max(...SALARIATI.total) + 20000;
  const yOf = (v) => PT + cH - ((v - minT) / (maxT - minT)) * cH;
  const gridVals = [1200000, 1250000, 1280000, 1310000];

  const COLORS_GRUPE = ['#1a56db','#0e7245'];
  const CAT_COLORS = {minister:'#1a56db',justitie:'#7c3aed',siguranta:'#c2410c',guvern:'#0891b2',cultura:'#d97706',parlament:'#0e7245'};

  return (
    <div style={{ flex: 1, padding: '20px 24px', maxWidth: 1200, margin: '0 auto', width: '100%' }}>
      {/* KPI top */}
      <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
        {[
          { label: 'Total posturi Ian 2026', val: fmtS(SALARIATI.total[12]), sub: 'Administrație publică centrală + locală', color: C.navy },
          { label: 'Variație vs. Ian 2025', val: `${new Intl.NumberFormat('en-US',{signDisplay:'always'}).format(SALARIATI.total[12]-SALARIATI.total[0])}`, sub: `${(((SALARIATI.total[12]-SALARIATI.total[0])/SALARIATI.total[0])*100).toFixed(2)}% față de ian. 2025`, color: SALARIATI.total[12] > SALARIATI.total[0] ? C.red : C.green },
          { label: 'Adm. Centrală Ian 2026', val: fmtS(SALARIATI.grupe[0].vals[12]), sub: `${((SALARIATI.grupe[0].vals[12]/SALARIATI.total[12])*100).toFixed(1)}% din total`, color: '#1a56db' },
          { label: 'Adm. Locală Ian 2026', val: fmtS(SALARIATI.grupe[1].vals[12]), sub: `${((SALARIATI.grupe[1].vals[12]/SALARIATI.total[12])*100).toFixed(1)}% din total`, color: '#0e7245' },
        ].map(({label,val,sub,color}) => (
          <div key={label} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: '14px 18px', flex: 1 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 6 }}>{label}</div>
            <div style={{ fontSize: 22, fontWeight: 700, color, lineHeight: 1, marginBottom: 4 }}>{val}</div>
            <div style={{ fontSize: 11, color: C.subtle }}>{sub}</div>
          </div>
        ))}
      </div>

      {/* Subtabs */}
      <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: 'hidden' }}>
        <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, padding: '0 16px', alignItems: 'center' }}>
          {[['institutii','🏛️ Pe Instituții'],['evolutie','📈 Evoluție în timp']].map(([id,lbl]) => (
            <button key={id} onClick={() => setSubtab(id)} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              padding: '12px 16px', fontSize: 12, fontFamily: 'DM Sans',
              fontWeight: subtab === id ? 600 : 400,
              color: subtab === id ? C.blue : C.muted,
              borderBottom: subtab === id ? `2px solid ${C.blue}` : '2px solid transparent',
              marginBottom: -1
            }}>{lbl}</button>
          ))}
          <div style={{ flex: 1 }} />
          {subtab === 'institutii' && (
            <div style={{ display: 'flex', gap: 4 }}>
              {[['toate','Toate'],['minister','Ministere'],['justitie','Justiție'],['siguranta','Siguranță'],['guvern','Guvern'],['parlament','Parlament']].map(([id,lbl]) => (
                <button key={id} onClick={() => setCatFilter(id)} style={{
                  background: catFilter === id ? C.navy : 'transparent',
                  color: catFilter === id ? '#fff' : C.muted,
                  border: `1px solid ${catFilter === id ? C.navy : C.border}`,
                  borderRadius: 5, padding: '4px 10px', fontSize: 10,
                  cursor: 'pointer', fontFamily: 'DM Sans'
                }}>{lbl}</button>
              ))}
            </div>
          )}
        </div>

        <div style={{ padding: subtab === 'institutii' ? 0 : 24 }}>

          {/* TAB 1 — Pe institutii */}
          {subtab === 'institutii' && (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                <thead>
                  <tr style={{ background: C.navy }}>
                    <th style={{ padding: '9px 14px', color: '#fff', fontWeight: 600, fontSize: 11, textAlign: 'left', position: 'sticky', left: 0, background: C.navy, minWidth: 240 }}>Instituție</th>
                    <th style={{ padding: '9px 12px', color: '#93c5fd', fontWeight: 600, fontSize: 10, textAlign: 'right', cursor: 'pointer', whiteSpace: 'nowrap' }} onClick={() => setSortBy('ian2026')}>Ian 2026 {sortBy==='ian2026'&&'↓'}</th>
                    <th style={{ padding: '9px 12px', color: '#86efac', fontWeight: 600, fontSize: 10, textAlign: 'right', whiteSpace: 'nowrap' }}>Ian 2025</th>
                    <th style={{ padding: '9px 12px', color: '#fca5a5', fontWeight: 600, fontSize: 10, textAlign: 'right', cursor: 'pointer', whiteSpace: 'nowrap' }} onClick={() => setSortBy('var')}>Variație {sortBy==='var'&&'↓'}</th>
                    {[3,5,7,9,11].map(i => (
                      <th key={i} style={{ padding: '9px 8px', color: 'rgba(255,255,255,0.5)', fontWeight: 400, fontSize: 9, textAlign: 'right', whiteSpace: 'nowrap' }}>{LUNI_SALAR[i].substring(0,3)}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sortedInstitutii.map((inst, i) => {
                    const varAbs = inst.vals[12] - inst.vals[0];
                    const varPct = (varAbs / inst.vals[0] * 100).toFixed(1);
                    const bg = i % 2 === 0 ? '#fff' : '#fafafa';
                    return (
                      <tr key={inst.name} style={{ background: bg, borderBottom: `1px solid ${C.border}` }}
                        onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                        <td style={{ padding: '7px 14px', color: C.text, position: 'sticky', left: 0, background: bg, display: 'flex', alignItems: 'center', gap: 6 }}>
                          <div style={{ width: 8, height: 8, borderRadius: '50%', background: CAT_COLORS[inst.cat] || C.blue, flexShrink: 0 }} />
                          {inst.name}
                        </td>
                        <td style={{ padding: '7px 12px', textAlign: 'right', fontFamily: 'DM Mono, monospace', fontWeight: 700, color: '#1a56db' }}>{fmtS(inst.vals[12])}</td>
                        <td style={{ padding: '7px 12px', textAlign: 'right', fontFamily: 'DM Mono, monospace', color: C.muted }}>{fmtS(inst.vals[0])}</td>
                        <td style={{ padding: '7px 12px', textAlign: 'right' }}>
                          <span style={{
                            background: varAbs < 0 ? C.greenLight : C.redLight,
                            color: varAbs < 0 ? C.green : C.red,
                            padding: '2px 7px', borderRadius: 4, fontSize: 10, fontWeight: 600
                          }}>{varAbs > 0 ? '+' : ''}{fmtS(varAbs)} ({varPct}%)</span>
                        </td>
                        {[3,5,7,9,11].map(idx => (
                          <td key={idx} style={{ padding: '7px 8px', textAlign: 'right', fontSize: 10, color: C.muted, fontFamily: 'DM Mono, monospace' }}>{fmtS(inst.vals[idx])}</td>
                        ))}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* TAB 2 — Evolutie in timp */}
          {subtab === 'evolutie' && (
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.navy, marginBottom: 4 }}>Evoluție număr posturi ocupate — Ian 2025 → Ian 2026</div>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 16 }}>Total administrație publică + defalcare centrală vs. locală</div>

              {/* Grafic linii SVG */}
              <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} onMouseLeave={() => setHover(null)}>
                {/* grid */}
                {gridVals.map(v => (
                  <g key={v}>
                    <line x1={PL} y1={yOf(v)} x2={W-PR} y2={yOf(v)} stroke={C.border} strokeWidth={0.5} strokeDasharray="3,3" />
                    <text x={PL-6} y={yOf(v)+4} textAnchor="end" fontSize={9} fill={C.muted}>{new Intl.NumberFormat('en-US').format(v)}</text>
                  </g>
                ))}

                {/* Linii grupe */}
                {SALARIATI.grupe.map((g, gi) => (
                  <g key={g.name}>
                    <polyline
                      points={g.vals.map((v,i) => `${xOf(i)},${yOf(v)}`).join(' ')}
                      stroke={COLORS_GRUPE[gi]} strokeWidth={2} fill="none" strokeDasharray={gi===1?'5,3':'0'} />
                    {g.vals.map((v,i) => (
                      <circle key={i} cx={xOf(i)} cy={yOf(v)} r={3} fill={COLORS_GRUPE[gi]} stroke="#fff" strokeWidth={1} />
                    ))}
                  </g>
                ))}

                {/* Linie total */}
                <polyline
                  points={SALARIATI.total.map((v,i) => `${xOf(i)},${yOf(v)}`).join(' ')}
                  stroke={C.navy} strokeWidth={2.5} fill="none" />
                {SALARIATI.total.map((v,i) => {
                  const isH = hover===i;
                  return (
                    <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                      <circle cx={xOf(i)} cy={yOf(v)} r={isH?6:3.5} fill={C.navy} stroke="#fff" strokeWidth={1.5} />
                      {isH && <text x={xOf(i)} y={yOf(v)-10} textAnchor="middle" fontSize={9} fontWeight={700} fill={C.navy}>{new Intl.NumberFormat('en-US').format(v)}</text>}
                      <text x={xOf(i)} y={H-6} textAnchor="middle" fontSize={8} fill={isH?C.navy:C.muted} fontWeight={isH?700:400}>{LUNI_SALAR[i].substring(0,3)}</text>
                    </g>
                  );
                })}

                {/* Legend */}
                <line x1={PL} y1={PT-15} x2={PL+20} y2={PT-15} stroke={C.navy} strokeWidth={2.5} />
                <text x={PL+24} y={PT-11} fontSize={9} fill={C.muted}>Total</text>
                {SALARIATI.grupe.map((g,gi) => (
                  <g key={g.name}>
                    <line x1={PL+gi*120+60} y1={PT-15} x2={PL+gi*120+80} y2={PT-15} stroke={COLORS_GRUPE[gi]} strokeWidth={2} strokeDasharray={gi===1?'4,2':'0'} />
                    <text x={PL+gi*120+84} y={PT-11} fontSize={9} fill={C.muted}>{g.name.split('.')[1]?.trim().split(' ').slice(0,2).join(' ')}</text>
                  </g>
                ))}

                {/* Tooltip */}
                {hover !== null && (() => {
                  const x = xOf(hover);
                  const tx = Math.min(Math.max(x-90, 5), W-190);
                  return (
                    <g>
                      <rect x={tx} y={8} width={185} height={72} rx={5} fill={C.navy} opacity={0.95} />
                      <text x={tx+10} y={24} fontSize={11} fontWeight={700} fill="#fff">{LUNI_SALAR[hover]}</text>
                      <text x={tx+10} y={38} fontSize={9} fill="#93c5fd">Total: {new Intl.NumberFormat('en-US').format(SALARIATI.total[hover])}</text>
                      <text x={tx+10} y={51} fontSize={9} fill="#6edbff">Centrală: {new Intl.NumberFormat('en-US').format(SALARIATI.grupe[0].vals[hover])}</text>
                      <text x={tx+10} y={64} fontSize={9} fill="#86efac">Locală: {new Intl.NumberFormat('en-US').format(SALARIATI.grupe[1].vals[hover])}</text>
                    </g>
                  );
                })()}
              </svg>

              {/* Tabel evolutie lunar */}
              <div style={{ marginTop: 20, overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
                  <thead>
                    <tr style={{ background: C.navy }}>
                      <th style={{ padding: '8px 12px', color: '#fff', fontWeight: 600, fontSize: 11, textAlign: 'left', minWidth: 180 }}>Categorie</th>
                      {LUNI_SALAR.map(l => (
                        <th key={l} style={{ padding: '8px 8px', color: '#fff', fontWeight: 500, fontSize: 9, textAlign: 'right', whiteSpace: 'nowrap' }}>{l}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {[
                      { name: 'TOTAL', vals: SALARIATI.total, bold: true },
                      { name: 'Adm. Centrală', vals: SALARIATI.grupe[0].vals },
                      { name: 'Adm. Locală', vals: SALARIATI.grupe[1].vals },
                    ].map((r, i) => (
                      <tr key={r.name} style={{ background: i===0?'#f0f7ff': i%2===0?'#fff':'#fafafa', borderBottom: `1px solid ${C.border}` }}>
                        <td style={{ padding: '7px 12px', fontWeight: r.bold?700:500, color: r.bold?C.navy:C.text, borderLeft: `3px solid ${i===0?C.navy:i===1?'#1a56db':'#0e7245'}` }}>{r.name}</td>
                        {r.vals.map((v, vi) => {
                          const prev = vi > 0 ? r.vals[vi-1] : null;
                          const delta = prev ? v - prev : null;
                          return (
                            <td key={vi} style={{ padding: '7px 8px', textAlign: 'right', fontFamily: 'DM Mono, monospace', fontSize: 10, fontWeight: r.bold?600:400 }}>
                              <div>{new Intl.NumberFormat('en-US').format(v)}</div>
                              {delta !== null && (
                                <div style={{ fontSize: 8, color: delta < 0 ? C.green : delta > 0 ? C.red : C.subtle }}>
                                  {delta > 0 ? '+' : ''}{new Intl.NumberFormat('en-US').format(delta)}
                                </div>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Footer sursa */}
      <div style={{ borderTop: `1px solid ${C.border}`, background: C.card, padding: '10px 0', marginTop: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#22c55e', flexShrink: 0 }} />
        <div style={{ fontSize: 11, color: C.muted }}>Sursa: Ministerul Finanțelor — Numărul de posturi ocupate în instituțiile și autoritățile publice</div>
        <span style={{ color: C.border }}>•</span>
        <a href="https://mfinante.gov.ro" target="_blank" rel="noopener noreferrer" style={{ fontSize: 11, color: C.blue, textDecoration: 'none' }}>🔗 mfinante.gov.ro</a>
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 11, color: C.subtle }}>Date: Ian 2025 – Ian 2026 • Actualizat lunar</div>
      </div>
    </div>
  );
};

          <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, padding: '0 16px' }}>
            {[
              { id: 'grafic', label: '📊 Grafic comparativ' },
              { id: 'deficit', label: '📈 Evoluție deficit' },
              { id: 'tabel', label: '⊞ Tabel date' },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                padding: '12px 16px', fontSize: 12, fontFamily: 'DM Sans',
                fontWeight: tab === t.id ? 600 : 400,
                color: tab === t.id ? C.blue : C.muted,
                borderBottom: tab === t.id ? `2px solid ${C.blue}` : '2px solid transparent',
                marginBottom: -1,
              }}>{t.label}</button>
            ))}
            <div style={{ flex: 1 }} />
            {tab === 'tabel' && (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', padding: '6px 0' }}>
                <input
                  placeholder="Caută indicator..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  style={{ border: `1px solid ${C.border}`, borderRadius: 5, padding: '4px 10px', fontSize: 11, fontFamily: 'DM Sans', outline: 'none', width: 160 }}
                />
                {['toate','venituri','cheltuieli','deficit'].map(f => (
                  <button key={f} onClick={() => setFilter(f)} style={{
                    background: filter === f ? C.navy : '#fff',
                    color: filter === f ? '#fff' : C.muted,
                    border: `1px solid ${filter === f ? C.navy : C.border}`,
                    borderRadius: 5, padding: '4px 10px', fontSize: 11, cursor: 'pointer', fontFamily: 'DM Sans',
                    textTransform: 'capitalize'
                  }}>{f}</button>
                ))}
              </div>
            )}
          </div>

          {/* Tab content */}
          <div style={{ padding: tab === 'tabel' ? 0 : 24 }}>
            {tab === 'grafic' && (
              <div style={{ display: 'flex', gap: 24 }}>
                <div style={{ flex: 2 }}>
                  <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Comparație lunară (mil. lei)</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 12 }}>Venituri vs. Cheltuieli — 2025 / 2026</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2, marginTop: 8 }}>
                    <div style={{ width: 3, height: 14, background: C.blue, borderRadius: 2 }} />
                    <span style={{ fontSize: 12, fontWeight: 600, color: C.blue }}>Venituri totale (mil. lei)</span>
                  </div>
                  <BarChartComparativ data={[
                    { ...venituriRow, ian26: venituriRow.ian26, feb26: venituriRow.feb26, cum26: venituriRow.cum26, cum25: venituriRow.cum25 },
                  ]} />
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2, marginTop: 12 }}>
                    <div style={{ width: 3, height: 14, background: '#7c3aed', borderRadius: 2 }} />
                    <span style={{ fontSize: 12, fontWeight: 600, color: '#7c3aed' }}>Cheltuieli totale (mil. lei)</span>
                  </div>
                  <BarChartComparativ data={[
                    { ...cheltuieliRow, ian26: cheltuieliRow.ian26, feb26: cheltuieliRow.feb26, cum26: cheltuieliRow.cum26, cum25: cheltuieliRow.cum25 },
                  ]} />
                </div>
                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <div style={{ background: C.bg, borderRadius: 8, padding: 14 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: C.muted, marginBottom: 8 }}>TOP CREȘTERI VENITURI 2026</div>
                    {DATA.rows.filter(r => r.cat === 'venituri' && !r.bold && r.var > 5).sort((a,b) => b.var - a.var).slice(0,4).map(r => (
                      <div key={r.label} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 11 }}>
                        <span style={{ color: C.text }}>{r.label}</span>
                        <span style={{ color: C.green, fontWeight: 600 }}>+{r.var.toFixed(1)}%</span>
                      </div>
                    ))}
                  </div>
                  <div style={{ background: C.bg, borderRadius: 8, padding: 14 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: C.muted, marginBottom: 8 }}>TOP SCĂDERI CHELTUIELI 2026</div>
                    {DATA.rows.filter(r => r.cat === 'cheltuieli' && !r.bold && r.var < 0).sort((a,b) => a.var - b.var).slice(0,4).map(r => (
                      <div key={r.label} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, fontSize: 11 }}>
                        <span style={{ color: C.text }}>{r.label}</span>
                        <span style={{ color: C.red, fontWeight: 600 }}>{r.var.toFixed(1)}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 'deficit' && (
              <div>
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 14, flexWrap: 'wrap', gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: C.navy, marginBottom: 3 }}>Evoluție Deficit Bugetar România — 2006–2025</div>
                    <div style={{ fontSize: 11, color: C.muted }}>Buget general consolidat (mil. lei) • Sursa: Ministerul Finanțelor</div>
                  </div>
                  <div style={{ display: 'flex', gap: 10, fontSize: 11, color: C.muted }}>
                    <span style={{ background: C.redLight, color: C.red, padding: '3px 8px', borderRadius: 4, fontWeight: 600 }}>
                      Max deficit: 2020 (-9.67% PIB)
                    </span>
                    <span style={{ background: C.greenLight, color: C.green, padding: '3px 8px', borderRadius: 4, fontWeight: 600 }}>
                      Min deficit: 2015 (-1.47% PIB)
                    </span>
                  </div>
                </div>
                <DeficitLineChart />
              </div>
            )}

            {tab === 'tabel' && <DataTable filter={filter} search={search} />}
          </div>
        </div>
      </div>}

      {/* ── Footer sursă ── */}
      <div style={{ borderTop: `1px solid ${C.border}`, background: C.card, padding: '10px 24px', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#22c55e', flexShrink: 0 }} />
        <div style={{ fontSize: 11, color: C.muted }}>{DATA.sursa}</div>
        <span style={{ color: C.border }}>•</span>
        <a href="https://mfinante.gov.ro/ro/domenii/bugetul-de-stat/informatii-executie-bugetara"
          target="_blank" rel="noopener noreferrer"
          style={{ fontSize: 11, color: C.blue, textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 3 }}>
          🔗 mfinante.gov.ro — Informații execuție bugetară
        </a>
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 11, color: C.subtle }}>Ultima actualizare: 15 Apr 2026 • Frecvență: lunar</div>
      </div>
      {/* ── Tweaks Panel ── */}
      {tweaksOpen && (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, width: 240,
          background: '#fff', border: `1px solid ${C.border}`, borderRadius: 10,
          boxShadow: '0 8px 32px rgba(0,0,0,0.12)', padding: 16, zIndex: 9999,
          fontFamily: 'DM Sans'
        }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.navy, marginBottom: 12, borderBottom: `1px solid ${C.border}`, paddingBottom: 8 }}>✏️ Tweaks</div>
          <div style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Tab implicit la încărcare</div>
            {['grafic','deficit','tabel'].map(v => (
              <label key={v} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, marginBottom: 3, cursor: 'pointer' }}>
                <input type="radio" name="defaultTab" checked={tw.defaultTab === v} onChange={() => { const n = {...tw, defaultTab: v}; setTw(n); setTab(v); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: n }, '*'); }} />
                {v.charAt(0).toUpperCase() + v.slice(1)}
              </label>
            ))}
          </div>
          <div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Vizibilitate grafice</div>
            {[['showChart','Grafic comparativ'],['showDeficitLine','Grafic evoluție deficit']].map(([k, l]) => (
              <label key={k} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, marginBottom: 3, cursor: 'pointer' }}>
                <input type="checkbox" checked={tw[k] === 'da'} onChange={e => { const n = {...tw, [k]: e.target.checked ? 'da' : 'nu'}; setTw(n); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: n }, '*'); }} />
                {l}
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
