<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datorie Publică — Ministerul Finanțelor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #f4f5f7; color: #1a1d23; }
</style>
</head>
<body>
<script type="text/babel">

const C = {
  bg: '#f4f5f7', card: '#ffffff', border: '#e8eaed',
  navy: '#0f2044', blue: '#1a56db', blueLight: '#e8f0fe',
  green: '#0e7245', greenLight: '#d4edda',
  red: '#b91c1c', redLight: '#fee2e2',
  text: '#1a1d23', muted: '#6b7280', subtle: '#9ca3af',
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "defaultTab": "grafic"
}/*EDITMODE-END*/;

/* ── Date datorie publică 2010–2025 ── */
const DATORIE = [
  { an: 2010, val: 159686.9, pct: 29.9 },
  { an: 2011, val: 193216.7, pct: 34.2 },
  { an: 2012, val: 221872.7, pct: 37.3 },
  { an: 2013, val: 240777.0, pct: 37.8 },
  { an: 2014, val: 263153.4, pct: 39.4 },
  { an: 2015, val: 270120.7, pct: 38.0 },
  { an: 2016, val: 285553.1, pct: 37.4 },
  { an: 2017, val: 301158.5, pct: 35.1 },
  { an: 2018, val: 330587.0, pct: 34.7 },
  { an: 2019, val: 373624.6, pct: 35.3 },
  { an: 2020, val: 498571.3, pct: 46.9 },
  { an: 2021, val: 576338.8, pct: 48.6 },
  { an: 2022, val: 665490.7, pct: 48.1 },
  { an: 2023, val: 784235.2, pct: 49.3 },
  { an: 2024, val: 964807.9, pct: 54.8 },
  { an: 'Dec 2025', val: 1138312.1, pct: 59.6 },
];

const fmt = (v, d=1) => new Intl.NumberFormat('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}).format(v);
const fmtK = (v) => Math.abs(v) >= 1000000 ? (v/1000000).toFixed(2)+'T' : Math.abs(v) >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0);

/* ── KPI Card ── */
const KPICard = ({ label, value, sub, delta, color = C.blue, warn }) => (
  <div style={{ background: warn ? '#fff8f0' : C.card, border: `1px solid ${warn ? '#fed7aa' : C.border}`, borderRadius: 10, padding: '16px 20px', flex: 1 }}>
    <div style={{ fontSize: 11, fontWeight: 600, color: C.muted, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>{label}</div>
    <div style={{ fontSize: 24, fontWeight: 700, color, lineHeight: 1, marginBottom: 5 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: C.subtle, marginBottom: 4 }}>{sub}</div>}
    {delta && <div style={{ fontSize: 11, color: delta > 0 ? C.red : C.green, fontWeight: 600 }}>{delta > 0 ? '▲' : '▼'} {Math.abs(delta).toFixed(1)}% față de an anterior</div>}
  </div>
);

/* ── Grafic Evoluție Datorie ── */
const DatorieChart = () => {
  const [hover, setHover] = React.useState(null);
  const [chartType, setChartType] = React.useState('combinat');

  const W = 900, H = 320, PL = 80, PR = 50, PT = 40, PB = 50;
  const chartW = W - PL - PR, chartH = H - PT - PB;
  const n = DATORIE.length;
  const xOf = (i) => PL + (i / (n - 1)) * chartW;

  const maxVal = Math.max(...DATORIE.map(d => d.val)) * 1.08;
  const maxPct = 65, minPct = 25;
  const rangePct = maxPct - minPct;

  const yOfVal = (v) => PT + chartH - (v / maxVal) * chartH;
  const yOfPct = (p) => PT + chartH - ((p - minPct) / rangePct) * chartH;

  const barW = chartW / n * 0.6;

  const getColor = (pct) => pct >= 55 ? '#dc2626' : pct >= 45 ? '#f97316' : pct >= 38 ? '#1a56db' : '#0e7245';

  return (
    <div>
      {/* Selector */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
        {[['combinat','📊 Evoluție datorie (mil. lei)'],['pib','📈 Datorie % din PIB'],['bare','⊞ Bare colorate']].map(([id, lbl]) => (
          <button key={id} onClick={() => setChartType(id)} style={{
            background: chartType === id ? C.navy : '#fff',
            color: chartType === id ? '#fff' : C.muted,
            border: `1px solid ${chartType === id ? C.navy : C.border}`,
            borderRadius: 6, padding: '5px 14px', fontSize: 12,
            cursor: 'pointer', fontFamily: 'DM Sans', fontWeight: chartType === id ? 600 : 400
          }}>{lbl}</button>
        ))}
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}
        onMouseLeave={() => setHover(null)}>

        {/* ── Evoluție datorie absolută ── */}
        {chartType === 'combinat' && <>
          <defs>
            <linearGradient id="datorieGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#1a56db" stopOpacity="0.2" />
              <stop offset="100%" stopColor="#1a56db" stopOpacity="0.02" />
            </linearGradient>
          </defs>
          {/* grid */}
          {[0, 250000, 500000, 750000, 1000000].map(v => {
            const y = yOfVal(v);
            return (
              <g key={v}>
                <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={C.border} strokeWidth={0.5} strokeDasharray="3,3" />
                <text x={PL - 6} y={y + 4} textAnchor="end" fontSize={9} fill={C.muted}>{fmtK(v)}</text>
              </g>
            );
          })}
          {/* area */}
          <polygon points={[`${xOf(0)},${PT+chartH}`, ...DATORIE.map((d,i) => `${xOf(i)},${yOfVal(d.val)}`), `${xOf(n-1)},${PT+chartH}`].join(' ')} fill="url(#datorieGrad)" />
          <polyline points={DATORIE.map((d,i) => `${xOf(i)},${yOfVal(d.val)}`).join(' ')} stroke="#1a56db" strokeWidth={2.5} fill="none" strokeLinejoin="round" />
          {/* 1000 mld milestone */}
          {(() => {
            const y = yOfVal(1000000);
            return <>
              <line x1={PL} y1={y} x2={W - PR} y2={y} stroke="#f97316" strokeWidth={1} strokeDasharray="5,3" />
              <text x={W - PR + 4} y={y + 4} fontSize={8} fill="#f97316">1.000K</text>
            </>;
          })()}
          {/* dots + labels */}
          {DATORIE.map((d, i) => {
            const x = xOf(i), y = yOfVal(d.val);
            const isH = hover === i;
            const col = getColor(d.pct);
            return (
              <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                <circle cx={x} cy={y} r={isH ? 6 : 3.5} fill={col} stroke="#fff" strokeWidth={1.5} />
                {(i % 2 === 0 || isH || i === n-1) && (
                  <text x={x} y={y - 10} textAnchor="middle" fontSize={isH ? 9 : 8} fontWeight={isH ? 700 : 400} fill={col}>
                    {fmtK(d.val)}
                  </text>
                )}
                <text x={x} y={H - 6} textAnchor="middle" fontSize={8.5} fill={C.text} fontWeight={isH ? 700 : 400}>{d.an}</text>
              </g>
            );
          })}
        </>}

        {/* ── % PIB ── */}
        {chartType === 'pib' && <>
          {[25, 30, 35, 40, 45, 50, 55, 60].map(v => {
            if (v < minPct || v > maxPct) return null;
            const y = yOfPct(v);
            return (
              <g key={v}>
                <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={v === 60 ? '#dc2626' : C.border} strokeWidth={v === 60 ? 1 : 0.5} strokeDasharray={v === 60 ? '5,3' : '3,3'} />
                <text x={PL - 6} y={y + 4} textAnchor="end" fontSize={9} fill={v === 60 ? '#dc2626' : C.muted}>{v}%</text>
              </g>
            );
          })}
          {/* Maastricht 60% label */}
          {(() => {
            const y = yOfPct(60);
            return <text x={W - PR + 4} y={y + 4} fontSize={8} fill="#dc2626">60%</text>;
          })()}
          <defs>
            <linearGradient id="pctGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#f97316" stopOpacity="0.2" />
              <stop offset="100%" stopColor="#f97316" stopOpacity="0.02" />
            </linearGradient>
          </defs>
          <polygon points={[`${xOf(0)},${yOfPct(minPct)}`, ...DATORIE.map((d,i) => `${xOf(i)},${yOfPct(d.pct)}`), `${xOf(n-1)},${yOfPct(minPct)}`].join(' ')} fill="url(#pctGrad)" />
          <polyline points={DATORIE.map((d,i) => `${xOf(i)},${yOfPct(d.pct)}`).join(' ')} stroke="#f97316" strokeWidth={2.5} fill="none" strokeLinejoin="round" />
          {DATORIE.map((d, i) => {
            const x = xOf(i), y = yOfPct(d.pct);
            const isH = hover === i;
            const col = getColor(d.pct);
            return (
              <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                <circle cx={x} cy={y} r={isH ? 6 : 3.5} fill={col} stroke="#fff" strokeWidth={1.5} />
                <text x={x} y={y - 10} textAnchor="middle" fontSize={isH ? 9.5 : 8} fontWeight={isH ? 700 : 500} fill={col}>{d.pct}%</text>
                <text x={x} y={H - 6} textAnchor="middle" fontSize={8.5} fill={C.text} fontWeight={isH ? 700 : 400}>{d.an}</text>
              </g>
            );
          })}
        </>}

        {/* ── Bare colorate ── */}
        {chartType === 'bare' && <>
          {[0, 250000, 500000, 750000, 1000000].map(v => {
            const y = yOfVal(v);
            return (
              <g key={v}>
                <line x1={PL} y1={y} x2={W - PR} y2={y} stroke={C.border} strokeWidth={0.5} strokeDasharray="3,3" />
                <text x={PL - 6} y={y + 4} textAnchor="end" fontSize={9} fill={C.muted}>{fmtK(v)}</text>
              </g>
            );
          })}
          {DATORIE.map((d, i) => {
            const x = PL + i * (chartW / n) + (chartW / n - barW) / 2;
            const bH = (d.val / maxVal) * chartH;
            const isH = hover === i;
            const col = getColor(d.pct);
            return (
              <g key={i} onMouseEnter={() => setHover(i)} style={{ cursor: 'pointer' }}>
                <rect x={x} y={PT + chartH - bH} width={barW} height={bH} fill={col} rx={2} opacity={isH ? 1 : 0.82} />
                <text x={x + barW/2} y={PT + chartH - bH - 4} textAnchor="middle" fontSize={isH ? 8.5 : 7.5} fontWeight={isH ? 700 : 400} fill={col}>{fmtK(d.val)}</text>
                <text x={x + barW/2} y={H - 6} textAnchor="middle" fontSize={8} fill={C.text} fontWeight={isH ? 700 : 400}>{d.an}</text>
              </g>
            );
          })}
        </>}

        {/* Hover tooltip */}
        {hover !== null && (() => {
          const d = DATORIE[hover];
          const x = chartType === 'bare'
            ? PL + hover * (chartW / n) + (chartW / n) / 2
            : xOf(hover);
          const tx = Math.min(Math.max(x - 90, 5), W - 195);
          const prev = hover > 0 ? DATORIE[hover - 1] : null;
          const varPct = prev ? ((d.val - prev.val) / prev.val * 100).toFixed(1) : null;
          return (
            <g>
              <rect x={tx} y={8} width={188} height={prev ? 78 : 65} rx={5} fill={C.navy} opacity={0.96} />
              <text x={tx+10} y={26} fontSize={11} fontWeight="700" fill="#fff">{d.an}</text>
              <text x={tx+10} y={40} fontSize={9} fill="#93c5fd">Datorie: {fmt(d.val)} mil. lei</text>
              <text x={tx+10} y={53} fontSize={9} fill="#fbbf24">% PIB: {d.pct}%</text>
              {varPct && <text x={tx+10} y={66} fontSize={9} fill="#fca5a5">Creștere vs. {DATORIE[hover-1].an}: +{varPct}%</text>}
            </g>
          );
        })()}
      </svg>

      {/* Legenda culori */}
      <div style={{ display: 'flex', gap: 12, marginTop: 8, fontSize: 11, color: C.muted }}>
        <span>🟢 &lt;38% PIB</span>
        <span>🔵 38–45% PIB</span>
        <span>🟠 45–55% PIB</span>
        <span>🔴 &gt;55% PIB — risc ridicat</span>
        <span style={{ marginLeft: 'auto', fontStyle: 'italic' }}>* 2025 = septembrie 2025</span>
      </div>
    </div>
  );
};

/* ── Tabel date ── */
const TabelDaterie = () => {
  const [hover, setHover] = React.useState(null);
  return (
    <div style={{ overflowX: 'auto' }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
        <thead>
          <tr style={{ background: C.navy }}>
            {['An','Datorie totală (mil. lei)','% PIB','Variație absolută','Variație %','Risc'].map(h => (
              <th key={h} style={{ padding: '9px 12px', color: '#fff', fontWeight: 600, fontSize: 11, textAlign: h === 'An' ? 'center' : 'right' }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {DATORIE.map((d, i) => {
            const prev = i > 0 ? DATORIE[i-1] : null;
            const varAbs = prev ? d.val - prev.val : null;
            const varPct = prev ? (varAbs / prev.val * 100) : null;
            const isBad = d.pct >= 55;
            const isMed = d.pct >= 45;
            const col = d.pct >= 55 ? C.red : d.pct >= 45 ? '#c2410c' : d.pct >= 38 ? C.blue : C.green;
            const bg = i % 2 === 0 ? '#fff' : '#fafafa';
            return (
              <tr key={i} style={{ background: bg, borderBottom: `1px solid ${C.border}`, cursor: 'default' }}
                onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
                <td style={{ padding: '7px 12px', textAlign: 'center', fontWeight: 700, color: C.navy }}>{d.an}</td>
                <td style={{ padding: '7px 12px', textAlign: 'right', fontFamily: 'DM Mono, monospace', fontWeight: hover === i ? 700 : 400 }}>
                  {fmt(d.val)}
                </td>
                <td style={{ padding: '7px 12px', textAlign: 'right' }}>
                  <span style={{ background: isBad ? C.redLight : isMed ? '#fff7ed' : '#f0fdf4', color: col, padding: '2px 8px', borderRadius: 4, fontWeight: 600, fontSize: 11 }}>
                    {d.pct}%
                  </span>
                </td>
                <td style={{ padding: '7px 12px', textAlign: 'right', fontFamily: 'DM Mono, monospace', color: varAbs > 0 ? C.red : C.green, fontSize: 11 }}>
                  {varAbs ? `+${fmt(varAbs)}` : '—'}
                </td>
                <td style={{ padding: '7px 12px', textAlign: 'right', color: varPct > 20 ? C.red : varPct > 10 ? '#c2410c' : C.muted, fontWeight: varPct > 20 ? 700 : 400, fontSize: 11 }}>
                  {varPct ? `+${varPct.toFixed(1)}%` : '—'}
                </td>
                <td style={{ padding: '7px 12px', textAlign: 'right' }}>
                  <span style={{ fontSize: 11 }}>
                    {d.pct >= 55 ? '🔴 Ridicat' : d.pct >= 45 ? '🟠 Moderat' : d.pct >= 38 ? '🔵 Mediu' : '🟢 Scăzut'}
                  </span>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div style={{ fontSize: 11, color: C.subtle, padding: '8px 12px', fontStyle: 'italic' }}>
        * 2025 = date septembrie 2025 (notificare fiscală octombrie 2025)
      </div>
    </div>
  );
};

/* ── App ── */
function App() {
  const [tab, setTab] = React.useState('grafic');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [tw, setTw] = React.useState(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const h = e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const latest = DATORIE[DATORIE.length - 1];
  const prev = DATORIE[DATORIE.length - 2];
  const varPct = (latest.val - prev.val) / prev.val * 100;

  return (
    <div style={{ minHeight: '100vh', background: C.bg, display: 'flex', flexDirection: 'column' }}>

      {/* Navbar */}
      <nav style={{ background: C.navy, height: 52, display: 'flex', alignItems: 'center', padding: '0 24px', gap: 24 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#fff' }}>📊 DatePublice.ro</div>
        <div style={{ display: 'flex', gap: 6, flex: 1, justifyContent: 'center' }}>
          {['Industrii','Instituții','Rapoarte'].map(l => (
            <div key={l} style={{ fontSize: 12, color: l === 'Instituții' ? '#fff' : 'rgba(255,255,255,0.55)', padding: '4px 10px', borderRadius: 5,
              borderBottom: l === 'Instituții' ? '2px solid #1a56db' : '2px solid transparent' }}>{l}</div>
          ))}
        </div>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)' }}>Cont</div>
      </nav>

      {/* Header instituție */}
      <div style={{ background: C.card, borderBottom: `1px solid ${C.border}`, padding: '0 24px' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div style={{ fontSize: 11, color: C.subtle, padding: '10px 0 0', display: 'flex', gap: 5 }}>
            <span>Acasă</span><span>›</span><span>Instituții</span><span>›</span>
            <span style={{ color: C.text, fontWeight: 500 }}>Ministerul Finanțelor</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '10px 0 12px' }}>
            <div style={{ width: 40, height: 40, background: '#e8f0fe', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20 }}>🏛️</div>
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: C.navy }}>Ministerul Finanțelor</div>
              <div style={{ fontSize: 11, color: C.muted }}>mfinante.ro • data.gov.ro</div>
            </div>
            <a href="https://mfinante.gov.ro" target="_blank" rel="noopener noreferrer"
              style={{ marginLeft: 'auto', fontSize: 11, color: C.blue, textDecoration: 'none', border: `1px solid ${C.blue}`, padding: '5px 12px', borderRadius: 6 }}>
              ↗ Site oficial
            </a>
          </div>
          {/* Subtabs */}
          <div style={{ display: 'flex', gap: 0, borderTop: `1px solid ${C.border}` }}>
            {['Deficit Bugetar','Datorie Publică','Nr. Angajați','Venituri & Cheltuieli','Execuție Bugetară'].map((t, i) => (
              <div key={t} style={{
                fontSize: 12, fontWeight: i === 1 ? 600 : 400,
                color: i === 1 ? C.blue : C.muted, padding: '10px 16px', cursor: 'pointer',
                borderBottom: i === 1 ? `2px solid ${C.blue}` : '2px solid transparent',
              }}>{t}</div>
            ))}
          </div>
        </div>
      </div>

      {/* Conținut */}
      <div style={{ flex: 1, padding: '20px 24px', maxWidth: 1200, margin: '0 auto', width: '100%' }}>

        {/* Titlu + export */}
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 16 }}>
          <div style={{ flex: 1 }}>
            <h1 style={{ fontSize: 18, fontWeight: 700, color: C.navy, marginBottom: 4 }}>Datorie Publică — Evoluție 2010–2025</h1>
            <p style={{ fontSize: 12, color: C.muted }}>Datoria administrației publice conform metodologiei UE (datorie guvernamentală) • mil. lei</p>
          </div>
          <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
            <button style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 6, padding: '7px 14px', fontSize: 12, color: C.text, cursor: 'pointer', fontFamily: 'DM Sans' }}>⬇ Export Excel</button>
            <button style={{ background: C.navy, border: 'none', borderRadius: 6, padding: '7px 14px', fontSize: 12, color: '#fff', cursor: 'pointer', fontFamily: 'DM Sans' }}>⬇ PDF</button>
          </div>
        </div>

        {/* KPI Cards */}
        <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
          <KPICard
            label="Datorie totală Dec 2025"
            value={`${fmt(latest.val)} mil. lei`}
            sub="Datorie administrație publică (UE)"
            delta={varPct}
            color={C.red}
            warn
          />
          <KPICard
            label="% din PIB (Sep 2025)"
            value={`${latest.pct}%`}
            sub={`Limita Maastricht: 60% PIB`}
            color={latest.pct >= 55 ? C.red : '#c2410c'}
            warn
          />
          <KPICard
            label="Creștere față de 2019"
            value={`+${fmt(latest.val - DATORIE[9].val)} mil. lei`}
            sub={`De la ${DATORIE[9].pct}% la ${latest.pct}% PIB`}
            color={C.red}
          />
          <KPICard
            label="Creștere 2024 (anuală)"
            value={`+${fmt(DATORIE[14].val - DATORIE[13].val)} mil. lei`}
            sub={`+${((DATORIE[14].val - DATORIE[13].val)/DATORIE[13].val*100).toFixed(1)}% față de 2023`}
            delta={(DATORIE[14].val - DATORIE[13].val)/DATORIE[13].val*100}
            color={C.red}
          />
        </div>

        {/* Tab card */}
        <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, overflow: 'hidden' }}>
          {/* Tab bar */}
          <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, padding: '0 16px' }}>
            {[
              { id: 'grafic', label: '📈 Evoluție grafic' },
              { id: 'tabel', label: '⊞ Tabel date' },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                padding: '12px 16px', fontSize: 12, fontFamily: 'DM Sans',
                fontWeight: tab === t.id ? 600 : 400,
                color: tab === t.id ? C.blue : C.muted,
                borderBottom: tab === t.id ? `2px solid ${C.blue}` : '2px solid transparent',
                marginBottom: -1,
              }}>{t.label}</button>
            ))}
          </div>

          <div style={{ padding: tab === 'tabel' ? 0 : 24 }}>
            {tab === 'grafic' && (
              <div>
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 14, flexWrap: 'wrap', gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: C.navy, marginBottom: 3 }}>Evoluție Datorie Publică România — 2010–2025</div>
                    <div style={{ fontSize: 11, color: C.muted }}>Datorie brută consolidată conform metodologiei UE • Sursa: Ministerul Finanțelor</div>
                  </div>
                  <div style={{ display: 'flex', gap: 10, fontSize: 11, flexWrap: 'wrap' }}>
                    <span style={{ background: C.redLight, color: C.red, padding: '3px 8px', borderRadius: 4, fontWeight: 600 }}>
                      2025: 59,6% PIB — aproape de limita 60%
                    </span>
                    <span style={{ background: '#fff7ed', color: '#c2410c', padding: '3px 8px', borderRadius: 4, fontWeight: 600 }}>
                      +7x față de 2010 în valoare nominală
                    </span>
                  </div>
                </div>
                <DatorieChart />
              </div>
            )}
            {tab === 'tabel' && <TabelDaterie />}
          </div>
        </div>

        {/* Alert Maastricht */}
        <div style={{ marginTop: 16, background: '#fff8f0', border: '1px solid #fed7aa', borderRadius: 10, padding: '14px 18px', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <span style={{ fontSize: 20 }}>⚠️</span>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#c2410c', marginBottom: 4 }}>România se apropie de limita Maastricht de 60% din PIB</div>
            <div style={{ fontSize: 12, color: '#92400e', lineHeight: 1.5 }}>
              Datoria publică a ajuns la <strong>59,6% din PIB</strong> în septembrie 2025, față de <strong>35,3%</strong> în 2019 și <strong>29,9%</strong> în 2010.
              Limita tratatului de la Maastricht este de <strong>60% din PIB</strong>. Depășirea acestui prag ar putea declanșa proceduri de deficit excesiv din partea UE.
            </div>
          </div>
        </div>
      </div>

      {/* Footer */}
      <div style={{ borderTop: `1px solid ${C.border}`, background: C.card, padding: '10px 24px', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#22c55e', flexShrink: 0 }} />
        <div style={{ fontSize: 11, color: C.muted }}>Sursa: Ministerul Finanțelor — Datoria administrației publice conform metodologiei UE</div>
        <span style={{ color: C.border }}>•</span>
        <a href="https://mfinante.gov.ro/ro/domenii/datoria-publica/datoria-publica-interna-si-externa" target="_blank" rel="noopener noreferrer"
          style={{ fontSize: 11, color: C.blue, textDecoration: 'none' }}>
          🔗 mfinante.gov.ro — Datorie publică
        </a>
        <div style={{ flex: 1 }} />
        <div style={{ fontSize: 11, color: C.subtle }}>Ultima actualizare: Dec 2025 • Frecvență: trimestrial</div>
      </div>

      {/* Tweaks */}
      {tweaksOpen && (
        <div style={{ position: 'fixed', bottom: 24, right: 24, width: 220, background: '#fff', border: `1px solid ${C.border}`, borderRadius: 10, boxShadow: '0 8px 32px rgba(0,0,0,0.12)', padding: 16, zIndex: 9999, fontFamily: 'DM Sans' }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.navy, marginBottom: 12, borderBottom: `1px solid ${C.border}`, paddingBottom: 8 }}>✏️ Tweaks</div>
          <div style={{ fontSize: 11, color: C.muted, marginBottom: 4 }}>Tab implicit</div>
          {['grafic','tabel'].map(v => (
            <label key={v} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, marginBottom: 4, cursor: 'pointer' }}>
              <input type="radio" name="tab" checked={tw.defaultTab === v} onChange={() => { const n = {...tw, defaultTab: v}; setTw(n); setTab(v); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: n }, '*'); }} />
              {v.charAt(0).toUpperCase() + v.slice(1)}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
