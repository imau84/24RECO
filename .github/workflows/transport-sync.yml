name: Fetch Transport Data

on:
  schedule:
    # Prima zi a fiecărei luni, ora 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:  # permite rulare manuală din GitHub UI

jobs:
  fetch-transport:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run fetch script
        run: |
          python scripts/fetch_transport.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transport-data.json
          git diff --staged --quiet || git commit -m "chore: actualizare date transport $(date +'%B %Y')"
          git push
