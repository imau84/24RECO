name: Actualizare Date Constructii INSSE

on:
  schedule:
    # Prima zi a fiecarei luni la 07:00 UTC (10:00 Romania)
    - cron: '0 7 1 * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python scripts/fetch_constructii.py

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet src/data/constructii/constructii_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/constructii/constructii_data.json
          git commit -m "date: actualizare automata LOC108A constructii $(date +'%Y-%m')"
          git push
