name: Update Energie (lunar)

on:
  schedule:
    # De două ori pe lună: pe 5 (încheie luna trecută la OPCOM și Weekly Oil Bulletin) și pe 22
    # (Eurostat publică energia lunară și IAPC în a doua jumătate a lunii). Commit doar dacă apar date noi.
    - cron: "0 7 5,22 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențe
        run: pip install requests pandas openpyxl

      - name: Descarcă datele (Eurostat, Ember, Weekly Oil Bulletin, OPCOM)
        run: python scripts/fetch_energie.py

      - name: Commit dacă s-a schimbat
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/energie/date.json scripts/data/opcom_pzu_lunar.csv
          if git diff --staged --quiet; then
            echo "Nicio modificare în date."
          else
            git commit -m "data: Energie ($(date +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
