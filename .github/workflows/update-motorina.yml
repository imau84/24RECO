name: Update prețuri motorină UE (Weekly Oil Bulletin)

on:
  schedule:
    # Comisia publică buletinul de obicei marți/miercuri, cu prețurile de luni.
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențe
        run: pip install openpyxl requests

      - name: Descarcă Oil Bulletin
        run: python scripts/fetch_oil_bulletin.py

      - name: Commit dacă s-a schimbat
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transport-data.json
          if git diff --staged --quiet; then
            echo "Nicio modificare."
          else
            git commit -m "data: prețuri motorină UE (Oil Bulletin, $(date +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
