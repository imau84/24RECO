name: Actualizare Date Industrie (Exporturi EXP101I)

on:
  schedule:
    - cron: '0 7 1 * *'   # Prima zi din luna, 07:00 UTC
  workflow_dispatch:        # Permite rulare manuala din tab-ul Actions

jobs:
  update-industrie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalare dependențe
        run: pip install requests

      - name: Rulare script fetch (EXP101I)
        run: python scripts/fetch_industrie.py

      - name: Verificare modificări
        id: check_changes
        run: |
          if git diff --quiet src/data/industrie/industrie_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nicio modificare"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Date noi detectate"
          fi

      - name: Commit și push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/industrie/industrie_data.json
          git commit -m "actualizare date industrie EXP101I $(date +'%Y-%m-%d')"
          git push

      - name: Rezumat
        run: |
          echo "### Industrie Update (EXP101I)" >> $GITHUB_STEP_SUMMARY
          echo "- Data rulare: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Modificat: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
