name: Update Comerț DRPCIV

on:
  schedule:
    # Rulează în ziua de 10 a fiecărei luni, la 07:00 UTC (09:00 ora României)
    - cron: "0 7 10 * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "An pentru backfill (ex. 2026). Lasă gol pentru doar luna curentă."
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesar pentru git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dezarhivatoare (.rar/.zip)
        # unrar (oficial, compatibil WinRAR) e principal — `unar` trunchiază
        # unele arhive RAR de la DRPCIV; 7z și unar rămân fallback.
        run: sudo apt-get update && sudo apt-get install -y unrar p7zip-full unar || sudo apt-get install -y p7zip-full unar

      - name: Install dependencies
        run: pip install pandas openpyxl xlrd

      - name: Run update script
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python scripts/fetch_comert.py --backfill ${{ github.event.inputs.backfill }}
          else
            python scripts/fetch_comert.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/comert_data.json
          if git diff --staged --quiet; then
            echo "Nicio modificare în date, skip commit."
          else
            UPDATED=$(date +"%Y-%m-%d")
            git commit -m "data: actualizare automată Comerț DRPCIV ($UPDATED)"
            git push
          fi
