name: Actualizare Date Turism (INS TEMPO TUR104)

on:
  schedule:
    # INS publica sosirile pentru luna M la inceputul lunii M+2.
    # Verificam saptamanal (miercuri 06:30 UTC); scriptul iese curat daca nu e nimic nou.
    - cron: '30 6 * * 3'
  workflow_dispatch:        # Permite rulare manuala din tab-ul Actions

jobs:
  update-turism:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalare dependențe
        run: pip install requests

      - name: Rulare script fetch (TUR104)
        run: python scripts/fetch_turism.py

      - name: Verificare modificări
        id: check_changes
        run: |
          if git diff --quiet public/turism_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nicio modificare"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Date noi detectate"
          fi

      - name: Commit și push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/turism_data.json
          git commit -m "actualizare date turism TUR104 $(date +'%Y-%m-%d')"
          git push

      - name: Rezumat
        run: |
          echo "### Turism Update (TUR104)" >> $GITHUB_STEP_SUMMARY
          echo "- Data rulare: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Modificat: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
