name: Actualizare Date Agricultura BRM

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-agricultura:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalare dependențe Python
        run: pip install playwright

      - name: Instalare Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Rulare script fetch
        run: python scripts/fetch_agricultura.py

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-brm
          path: |
            debug_brm.json
            debug_frame_*.txt
          retention-days: 1

      - name: Verificare modificări
        id: check_changes
        run: |
          if git diff --quiet src/data/agricultura/agricultura_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit și push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/agricultura/agricultura_data.json
          git commit -m "actualizare date agricultura BRM $(date +'%Y-%m-%d')"
          git push

      - name: Rezumat
        run: |
          echo "### Agricultura Update" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Modificat: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
