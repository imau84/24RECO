name: Actualizare Date Agricultura BRM

on:
  schedule:
    # Luni dimineața la 08:00 ora României (06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # permite rulare manuală din GitHub Actions

jobs:
  update-agricultura:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalare dependențe
        run: |
          pip install requests beautifulsoup4

      - name: Rulare script fetch
        run: python scripts/fetch_agricultura.py

      - name: Verificare modificări
        id: check_changes
        run: |
          if git diff --quiet src/data/agricultura/agricultura_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nicio modificare în date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Date noi detectate"
          fi

      - name: Commit și push date noi
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/agricultura/agricultura_data.json
          git commit -m "actualizare date agricultura BRM $(date +'%Y-%m-%d')"
          git push

      - name: Rezumat
        run: |
          echo "### Agricultura Update" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Modificat: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
