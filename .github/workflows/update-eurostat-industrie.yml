name: Update Eurostat industrie (lunar)

on:
  schedule:
    # Lunar, pe 25: Eurostat publică producția/prețurile/forța de muncă până pe ~16,
    # iar Ember își actualizează fișierul lunar în jurul zilei de 20–25.
    - cron: "0 6 25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențe
        run: pip install requests pandas

      - name: Descarcă datele (Eurostat, Ember, energy-charts)
        run: python scripts/fetch_eurostat_industrie.py

      - name: Commit dacă s-a schimbat
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/industrie/eurostat.json
          if git diff --staged --quiet; then
            echo "Nicio modificare în date."
          else
            git commit -m "data: Eurostat industrie ($(date +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
