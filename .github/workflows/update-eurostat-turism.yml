name: Update Eurostat turism (lunar)

on:
  schedule:
    # Lunar, pe 20: până atunci Eurostat publică luna nouă pentru HoReCa (~7), prețuri (~17-19)
    # și gradul de ocupare; pasagerii aerieni apar cu câteva luni întârziere. Commit doar dacă apar date noi.
    - cron: "30 6 20 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează dependențe
        run: pip install requests pandas

      - name: Descarcă datele (Eurostat)
        run: python scripts/fetch_eurostat_turism.py

      - name: Commit dacă s-a schimbat
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/turism/eurostat.json
          if git diff --staged --quiet; then
            echo "Nicio modificare în date."
          else
            git commit -m "data: Eurostat turism ($(date +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
