name: Actualizare Date BNR

on:
  schedule:
    - cron: '0 7 * * 1'  # Luni 09:00 / 10:00 Romania (vara/iarna)
  workflow_dispatch:

jobs:
  update-bnr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalare dependențe
        run: pip install requests

      - name: Rulare script fetch BNR
        run: python scripts/fetch_bnr.py

      - name: Verificare modificări
        id: check_changes
        run: |
          if git diff --quiet public/bnr_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Nicio modificare în datele BNR"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Date BNR noi detectate"
          fi

      - name: Commit și push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/bnr_data.json
          git commit -m "actualizare date BNR $(date +'%Y-%m-%d')"
          git push
